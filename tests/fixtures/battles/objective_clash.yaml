# Fixtura roster-pair wierna regułom: 5 celów + 4 oddziały/stronę, 72″×48″.
# Identyczny layout celów co demo_skirmish (pkt 5.a/b/c), różni się ROZSTAWIENIEM.
#
# Rozstawienie WYSUNIĘTE: oddziały startują przy własnych celach w strefie
# (pkt 5.b: ≥1 cel/strefa) → cele w strefie są osiągalne w JEDNYM ruchu (pkt 15.a,
# 6″). W przeciwieństwie do demo_skirmish (cel środkowy ~18″ = kilka ruchów, poza
# horyzontem depth-1), tu bot z kontrolą celów (pkt 5.d/5.f) od razu zajmuje i
# trzyma 2 cele domowe → demonstruje, że heurystyka realnie wykorzystuje cele,
# gdy są w horyzoncie. Cel środkowy (36,24) pozostaje poza strefą (x>24) =
# nieosiągalny w 1 ruchu nawet stąd (realne ograniczenie reguł rozstawienia).

name: "Clash 4v4 / 5 celów (rozstawienie wysunięte)"

objectives:
  - {id: 1, position: [12, 12]}   # strefa P0, lewo
  - {id: 2, position: [12, 36]}   # strefa P0, prawo
  - {id: 3, position: [36, 24]}   # środek (poza strefami → 1-ruch niedostępny)
  - {id: 4, position: [60, 12]}   # strefa P1, lewo
  - {id: 5, position: [60, 36]}   # strefa P1, prawo

