# Fixtura roster-pair wierna regułom + realnej geometrii (spec usera 2026-06-10).
#
# Plansza 72″ (szerokość, oś x) × 48″ (głębokość, oś y). Origin = lewy-dolny róg.
# Strefy rozstawienia wzdłuż osi y (pkt 3.a, 24″ od siebie; głębokość 12″):
#   P0: y∈[0,12], P1: y∈[36,48]  → granice wewn. y=12 i y=36, odległe o 24″.
#   12 (P0) + 24 (luka) + 12 (P1) = 48″ głębokości planszy.
# Oddziały „przyklejone do granicy rozstawienia" → P0 na y=12, P1 na y=36
#   (armie startują 24″ od siebie — w zasięgu karabinu 24″ od rundy 1).
#
# 5 CELÓW (pkt 5.a) wg pkt 5.b (≥1 w każdej strefie + lewo/prawo planszy) i
# pkt 5.c (≥12″ od siebie, ≥6″ od krawędzi → x∈[6,66], y∈[6,42]) — quincunx:
#   (18,8) P0+lewo   (54,8) P0+prawo
#   (18,40) P1+lewo  (54,40) P1+prawo
#   (36,24) środek (kontestowany)
#
# 4 proste oddziały/stronę (pkt 2.a min.): 5 modeli T3 Q4 D5, 2× karabin (24″) +
# 2× miecz (0″), rozłożone na froncie. Lustrzane strony (symetria).

name: "Demo 4v4 / 5 celów (72x48, strefy 24 apart)"

objectives:
  - {id: 1, position: [18, 8]}    # P0, lewo
  - {id: 2, position: [54, 8]}    # P0, prawo
  - {id: 3, position: [36, 24]}   # środek
  - {id: 4, position: [18, 40]}   # P1, lewo
  - {id: 5, position: [54, 40]}   # P1, prawo

terrain:
  - shape: circle
    center: [36, 24]
    radius: 3
    features: [Blokujacy]

rosters:
