name: szop

services:
  szop-app:
    image: ${SZOP_IMAGE:-ghcr.io/rozgladacz/szop:latest}
    restart: unless-stopped
    command: ["uvicorn", "app.main:public_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    # Brak sekcji "ports" — publiczny dostęp zapewnia osobny stos brama.
    volumes:
      - ${SZOP_DATA_DIR:-./data}:/app/data
    env_file:
      - path: .env
        required: false   # Przy publicznym dostępie skonfiguruj .env według DEPLOY.md.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/auth/login')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - default
      - szop-edge

  szop-backup:
    image: ${SZOP_IMAGE:-ghcr.io/rozgladacz/szop:latest}
    restart: unless-stopped
    entrypoint: ["python", "-m", "app.scripts.backup_loop"]
    healthcheck:
      test: ["CMD-SHELL", "grep -qa 'app.scripts.backup_loop' /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - ${SZOP_DATA_DIR:-./data}:/app/data
    env_file:
      - path: .env
        required: false
    depends_on:
      szop-app:
        condition: service_healthy

networks:
  szop-edge:
    external: true
    name: ${SZOP_EDGE_NETWORK:-brama-szop}
